name: Publish ALFA web
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: alfa-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: irenopaulino/GAME-STUDIO-AI
          ref: alfa/consolidacao-2026-11-23
          token: ${{ secrets.ALFA_SOURCE_TOKEN }}
          persist-credentials: false
          path: source
      - name: Check whether the source version changed
        id: version
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git -C source rev-parse HEAD)
          published=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "https://irenopaulino.github.io/Test-Pro-Fishing/source-version.txt?check=${GITHUB_RUN_ID}" || true)
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$sha" == "$published" && "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already published: $sha"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Publishing source: $sha"
          fi
      - name: Install Godot and export templates
        if: steps.version.outputs.changed == 'true'
        run: |
          curl -fL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          curl -fL -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p ~/.local/share/godot/export_templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/4.4.1.stable
      - name: Export Web
        if: steps.version.outputs.changed == 'true'
        working-directory: source/games/pro-fisher-genesis
        run: |
          mkdir -p build/web
          set -euo pipefail
          godot=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          "$godot" --headless --editor --import --quit 2>&1 | tee /tmp/publish-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR: Failed loading' /tmp/publish-import.log; then exit 1; fi
          for test in deck_rest_smoke fishing_line_smoke alfa_genesis_line_smoke line_view_smoke; do
            if [[ -f "tests/$test.gd" ]]; then
              timeout 120 "$godot" --headless --script "res://tests/$test.gd" 2>&1 | tee "/tmp/$test.log"
              if grep -E 'SCRIPT ERROR:|FAIL: |Parse Error:' "/tmp/$test.log"; then exit 1; fi
              grep -q 'PASS:' "/tmp/$test.log"
            fi
          done
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          git rev-parse HEAD > build/web/source-version.txt
      - uses: actions/upload-pages-artifact@v3
        if: steps.version.outputs.changed == 'true'
        with:
          path: source/games/pro-fisher-genesis/build/web
  deploy:
    needs: publish
    if: needs.publish.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
